name: Release

# 推送 v* 形式的 tag 时自动打包三平台产物并发布，例如:
#   git tag v0.2.2 && git push origin v0.2.2
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── 三平台并行构建 ──
  build:
    name: 构建 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成更新日志需要完整历史与 tag，浅克隆拿不到
          fetch-depth: 0

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 解析版本号
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 同步 pubspec.yaml 版本号
        shell: bash
        run: |
          # 不使用 sed -i：BSD 与 GNU 的写法互不兼容
          sed -E "s/^version: .*/version: ${VERSION}/" pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml
          grep -q "^version: ${VERSION}$" pubspec.yaml \
            || { echo "❌ pubspec.yaml 版本同步失败"; exit 1; }
          grep '^version:' pubspec.yaml

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          # 官方文档里的 libstdc++-12-dev 是过时指令：Ubuntu 24.04 只有 gcc-13/14，
          # 该包不存在，装上会直接让 apt 失败。libstdc++ 由 clang 与基础镜像提供。
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: 构建 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: flutter build macos --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: 构建 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: flutter build windows --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: 构建 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: flutter build linux --release --build-number "${GITHUB_RUN_NUMBER}"

      # ── 各平台打包 ──

      - name: 打包 dmg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp -R build/macos/Build/Products/Release/bilibili_downloader.app /tmp/BiliDown.app
          # Release.entitlements 缺 network.client 时沙箱会拦掉全部网络请求，
          # 表现成「搜索一直失败」，这里直接让构建失败以免发出坏包
          codesign -d --entitlements - /tmp/BiliDown.app 2>&1 | grep -q 'network.client' \
            || { echo "❌ 产物缺少 network.client 权限，release 包将无法联网"; exit 1; }
          mkdir -p /tmp/dmg
          cp -R /tmp/BiliDown.app /tmp/dmg/BiliDown.app
          ln -s /Applications /tmp/dmg/Applications
          hdiutil create -volname "biliDown" -srcfolder /tmp/dmg -ov -format UDZO \
            "BiliDown-${VERSION}-macos.dmg"
          ls -lh "BiliDown-${VERSION}-macos.dmg"

      - name: 打包 zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "BiliDown-$env:VERSION-windows.zip"

      - name: 打包 tar.gz (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "BiliDown-${VERSION}-linux.tar.gz" -C build/linux/x64/release/bundle .
          ls -lh "BiliDown-${VERSION}-linux.tar.gz"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: BiliDown-${{ matrix.name }}
          path: BiliDown-*
          if-no-files-found: error

  # ── 汇总发布（三个平台都成功后才发）──
  release:
    name: 发布 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: 同步 pubspec.yaml 版本号
        run: |
          sed -E "s/^version: .*/version: ${VERSION}/" pubspec.yaml > pubspec.tmp
          mv pubspec.tmp pubspec.yaml

      - name: 生成本次版本的更新日志
        run: bash .github/scripts/changelog.sh "$VERSION" > changelog_section.md

      - name: 更新 CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf '# 更新日志\n\n' > CHANGELOG.md
          fi
          # 该版本段落已存在（手工维护过）则不覆盖
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md 已包含 ${VERSION} 段落，保留现有内容"
            exit 0
          fi
          # 无 "## [" 段落时 grep 退出码为 1，需兜住，否则 set -e 会中断步骤
          FIRST="$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1 || true)"
          if [ -n "$FIRST" ]; then
            head -n "$((FIRST - 1))" CHANGELOG.md > CHANGELOG.new
            cat changelog_section.md >> CHANGELOG.new
            echo >> CHANGELOG.new
            tail -n "+$FIRST" CHANGELOG.md >> CHANGELOG.new
          else
            cat CHANGELOG.md > CHANGELOG.new
            cat changelog_section.md >> CHANGELOG.new
          fi
          mv CHANGELOG.new CHANGELOG.md
          cat CHANGELOG.md

      - name: 提交 CHANGELOG.md 与 pubspec.yaml
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md pubspec.yaml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(release): 发布 ${VERSION} [skip ci]"
            # main 已前进时推送会失败，不应阻塞发布
            git push origin HEAD:main || echo "⚠️ 推送失败，本次跳过"
          fi

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 组装 Release 说明
        run: |
          cat changelog_section.md > release_notes.md
          cat >> release_notes.md <<'EOF'
          ---

          ### 📦 下载

          | 平台 | 文件 | 说明 |
          |---|---|---|
          | macOS | `BiliDown-*-macos.dmg` | 打开后把 BiliDown 拖进「应用程序」 |
          | Windows | `BiliDown-*-windows.zip` | 解压后运行 `bilibili_downloader.exe` |
          | Linux | `BiliDown-*-linux.tar.gz` | 解压后运行 `bilibili_downloader` |

          macOS 包未做 Apple 开发者签名与公证。首次打开若提示「已损坏」或「无法验证开发者」，
          先执行一次再打开：

          ```bash
          xattr -cr /Applications/BiliDown.app
          ```
          EOF
          cat release_notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "biliDown v${VERSION}" \
            --notes-file release_notes.md \
          || gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
