name: Release

# 推送 v* 形式的 tag 时自动打包并发布，例如:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 生成更新日志需要完整的历史与 tag，浅克隆会拿不到
          fetch-depth: 0

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ── 更新日志 ──

      - name: 同步 pubspec.yaml 版本号
        run: |
          sed -i '' -E "s/^version: .*/version: ${VERSION}/" pubspec.yaml
          grep -q "^version: ${VERSION}$" pubspec.yaml \
            || { echo "❌ pubspec.yaml 版本同步失败"; exit 1; }
          grep '^version:' pubspec.yaml

      - name: 生成本次版本的更新日志
        run: bash .github/scripts/changelog.sh "$VERSION" > changelog_section.md

      - name: 更新 CHANGELOG.md
        run: |
          if [ ! -f CHANGELOG.md ]; then
            printf '# 更新日志\n\n' > CHANGELOG.md
          fi
          # 该版本段落已存在（手工维护过）则不覆盖
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "CHANGELOG.md 已包含 ${VERSION} 段落，保留现有内容"
            exit 0
          fi
          # 新版本段落插入到第一个 "## [" 之前
          # 无 "## [" 段落时 grep 退出码为 1，需兜住，否则 set -e 会中断步骤
          FIRST="$(grep -n '^## \[' CHANGELOG.md | head -1 | cut -d: -f1 || true)"
          if [ -n "$FIRST" ]; then
            head -n "$((FIRST - 1))" CHANGELOG.md > CHANGELOG.new
            cat changelog_section.md >> CHANGELOG.new
            echo >> CHANGELOG.new
            tail -n "+$FIRST" CHANGELOG.md >> CHANGELOG.new
          else
            cat CHANGELOG.md > CHANGELOG.new
            cat changelog_section.md >> CHANGELOG.new
          fi
          mv CHANGELOG.new CHANGELOG.md
          cat CHANGELOG.md

      - name: 提交 CHANGELOG.md 与 pubspec.yaml
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md pubspec.yaml
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(release): 发布 ${VERSION} [skip ci]"
            # main 已前进时推送会失败，不应阻塞发布
            git push origin HEAD:main || echo "⚠️ 推送失败，本次跳过"
          fi

      # ── 构建与打包 ──

      - name: 构建 macOS Release 包
        run: |
          # 版本号由上面同步进 pubspec.yaml，这里只补构建号
          flutter build macos --release --build-number "${GITHUB_RUN_NUMBER}"

      - name: 打包并校验权限
        run: |
          cp -R build/macos/Build/Products/Release/bilibili_downloader.app /tmp/BiliDown.app
          # Release.entitlements 缺 network.client 时，沙箱会拦掉全部网络请求，
          # 表现成「搜索一直失败」，这里直接让构建失败以免发出坏包
          codesign -d --entitlements - /tmp/BiliDown.app 2>&1 | grep -q 'network.client' \
            || { echo "❌ 产物缺少 network.client 权限，release 包将无法联网"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent /tmp/BiliDown.app "BiliDown-${VERSION}.zip"
          ls -lh "BiliDown-${VERSION}.zip"

      # ── 发布 ──

      - name: 组装 Release 说明
        run: |
          cat changelog_section.md > release_notes.md
          cat >> release_notes.md <<'EOF'
          ---

          ### 📦 安装

          1. 下载下方 `BiliDown-*.zip`，解压得到 `BiliDown.app`
          2. 拖入「应用程序」后首次打开，若提示「已损坏」或「无法验证开发者」，先执行一次：

          ```bash
          xattr -cr /Applications/BiliDown.app
          ```

          再打开即可。该包未做 Apple 开发者签名与公证，这是正常现象。
          EOF
          cat release_notes.md

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "BiliDown-${VERSION}.zip" \
            --title "biliDown v${VERSION}" \
            --notes-file release_notes.md
